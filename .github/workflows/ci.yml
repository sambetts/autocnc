name: CI

# Deliberately NOT run on push.
#
# This repository is experimental and the mod-build job below checks out a ~58MB engine submodule
# and builds the whole of OpenRA, so a push that only moved a paragraph of documentation costs
# minutes of queueing for nothing. Run it when it is worth running:
#
#   gh workflow run ci.yml          # or the Run workflow button on the Actions tab
#
# Opening a pull request still runs it automatically. Worth doing before anything that has to
# work on a machine other than the one it was written on: CI has already caught a real bug here
# that a developer machine hid, when stale DLLs in bin/ made a broken build look fine locally.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# A newer run makes an older one pointless, and queueing is what actually costs time on a small
# repository — the shared runners are not always immediately available.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the pure decision logic needs no engine at all, so this job finishes in
  # seconds and does not check out the ~58MB engine submodule.
  logic-tests:
    name: Mode logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test AutoCnC.Core
        run: dotnet test src/AutoCnC.Core.Tests/AutoCnC.Core.Tests.csproj -c Release --nologo

      # The evidence pipeline derives summary.json, units.csv, the checks and the cross-run trend
      # from a finished fight. It targets plain net8.0 rather than net8.0-windows precisely so it
      # can be tested here, on Linux, alongside the mode logic, rather than only in the Windows
      # launcher job.
      - name: Test the evidence pipeline
        run: dotnet test tools/AutoCnC.Evidence.Tests/AutoCnC.Evidence.Tests.csproj -c Release --nologo

      # The platform has test suites; battle bots deliberately do not, because a bot is judged by
      # whether it wins. An improvement round once re-created the reference bot's suite after the
      # rule was removed from the prompt half that rounds rewrite, so the rule is now checked.
      - name: Check no battle bot has tests
        shell: pwsh
        run: ./scripts/check-bot-tests.ps1

  # Full verification: build the pinned engine, compile our traits against it, then run
  # OpenRA's own YAML linter, which constructs every actor in the mod.
  mod-build:
    name: Engine build and mod lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and patch the pinned OpenRA engine
        shell: pwsh
        run: ./scripts/setup.ps1

      - name: Check engine patch handling
        shell: pwsh
        run: ./scripts/check-engine-patch.ps1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'engine/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build OpenRA engine
        run: dotnet build engine/OpenRA.sln -c Release -v minimal --nologo

      - name: Build AutoC&C platform
        run: dotnet build AutoCnC.sln -c Release -v minimal --nologo

      - name: Test engine-backed SDK and platform
        run: |
          dotnet test src/AutoCnC.Sdk.Tests/AutoCnC.Sdk.Tests.csproj -c Release --no-build --nologo
          dotnet test src/AutoCnC.Platform.Tests/AutoCnC.Platform.Tests.csproj -c Release --no-build --nologo

      # Package consumers must restore after pack from an empty cache: the local packages retain
      # version 0.1.0, so the normal cross-run NuGet cache may otherwise hide stale SDK binaries.
      - name: Pack AutoC&C packages
        run: dotnet pack AutoCnC.sln -c Release -v minimal --nologo

      - name: Build package consumers
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/autocnc-package-consumer-cache
        run: |
          rm -rf "$NUGET_PACKAGES"
          dotnet build tools/AutoCnC.PackageConsumer/AutoCnC.PackageConsumer.csproj -c Release -v minimal --nologo
          dotnet build bots/Reference/ReferenceBot.sln -c Release -v minimal --nologo

      # The improvement agent treats the SDK surface in docs/agent-mechanics.md as gospel, so a
      # stale copy actively steers it wrong: a hand-maintained one once claimed the resource API
      # did not exist for several rounds after it shipped. Generated, therefore checked.
      - name: Check the agent SDK reference is current
        shell: pwsh
        run: ./scripts/export-agent-api.ps1 -Check

      - name: Export resolved agent rules
        env:
          ENGINE_DIR: ${{ github.workspace }}/engine
          MOD_SEARCH_PATHS: ${{ github.workspace }}/mods,${{ github.workspace }}/engine/mods
        run: |
          dotnet engine/bin/OpenRA.Utility.dll autocnc --export-agent-rules "$RUNNER_TEMP/game-rules.json"
          test -s "$RUNNER_TEMP/game-rules.json"

      - name: Lint mod YAML
        env:
          ENGINE_DIR: ${{ github.workspace }}/engine
          MOD_SEARCH_PATHS: ${{ github.workspace }}/mods,${{ github.workspace }}/engine/mods
        run: |
          set -o pipefail
          dotnet engine/bin/OpenRA.Utility.dll autocnc --check-yaml 2>&1 | tee lint.log
          if grep -q '^Error' lint.log; then
            echo "::error::YAML lint reported errors"
            exit 1
          fi

  # The launcher is a Windows Forms front end for scripts/, so it is not in AutoCnC.sln and the
  # Linux jobs above never see it. Build it here so it cannot rot unnoticed.
  launcher-build:
    name: Launcher build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the launcher
        run: dotnet build tools/AutoCnC.Launcher/AutoCnC.Launcher.sln -c Release -v minimal --nologo

      - name: Test launcher workflow
        run: dotnet test tools/AutoCnC.Launcher/AutoCnC.Launcher.sln -c Release --no-build --nologo
