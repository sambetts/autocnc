#
# We override the AutoTarget mixin templates from cnc's defaults.yaml so that every actor which
# would have received engine auto-targeting gets a ProgrammableController instead.
#
# AutoTarget is neutered rather than deleted. Two reasons:
#
#  1. Several actors add their own AutoTargetPriority traits (e.g. AutoTargetPriority@Air on
#     apc), and those declare Requires<AutoTargetInfo>. Deleting AutoTarget makes them
#     unconstructible.
#  2. Gating it behind a never-granted condition trips the engine's condition linter, which
#     rejects consumed-but-never-granted conditions.
#
# Forcing HoldFire is fully inert and needs no conditions: AutoTarget.Damaged() returns early on
# `Stance < ReturnFire`, and TickIdle() returns early on `Stance < Defend`. ITick only decrements
# a scan counter. EnableStances: False stops anything changing it back at runtime.

^AutoTargetGround:
	AutoTarget:
		InitialStance: HoldFire
		InitialStanceAI: HoldFire
		EnableStances: False
		ScanOnIdle: False
	ProgrammableController:
		TickInterval: 8
		ScanRadius: 8c0

^AutoTargetAir:
	AutoTarget:
		InitialStance: HoldFire
		InitialStanceAI: HoldFire
		EnableStances: False
		ScanOnIdle: False
	ProgrammableController:
		TickInterval: 8
		ScanRadius: 10c0

^AutoTargetAll:
	AutoTarget:
		InitialStance: HoldFire
		InitialStanceAI: HoldFire
		EnableStances: False
		ScanOnIdle: False
	ProgrammableController:
		TickInterval: 8
		ScanRadius: 8c0

# Per-actor overrides. Anything inheriting the mixins above already has a controller, so these
# only need to state what differs.
#
# Artillery outranges everything it fights, so it holds a much wider tether and evaluates less
# often (it has nothing useful to do between shots anyway).
MSAM:
	ProgrammableController:
		TickInterval: 15
		ScanRadius: 12c0

# Unarmed actors never inherited the AutoTarget mixins, so they need the controller adding
# explicitly.

# Harvesters: the motivating case for '/mode type harv RunHomeMode'. Note that combat modes
# no-op on weaponless units, so a blanket '/mode all DefensiveMode' will not stop them mining.
HARV:
	ProgrammableController:
		TickInterval: 12
		ScanRadius: 7c0

# The MCV and the construction yard it unfolds into. Neither inherits the AutoTarget mixins, so
# they need the controller adding explicitly.
#
# Note there is no mode named here. Which mode runs is the loaded battle module's decision, not
# the mod's: the platform ships no strategy. Role is only a hint a module can target instead of
# hardcoding actor names.
MCV:
	ProgrammableController:
		TickInterval: 10
		Role: Builder

FACT:
	ProgrammableController:
		TickInterval: 25
		Role: Builder

# Production buildings, so a module can drive unit training from them.
PYLE:
	ProgrammableController:
		TickInterval: 25
		Role: Producer

HAND:
	ProgrammableController:
		TickInterval: 25
		Role: Producer

WEAP:
	ProgrammableController:
		TickInterval: 25
		Role: Producer

AFLD:
	ProgrammableController:
		TickInterval: 25
		Role: Producer
