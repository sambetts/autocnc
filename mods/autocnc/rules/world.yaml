#
# ModeExecutor runs the loaded BATTLE BOT for the LOCAL player only. A bot owns several doctrines
# — an opening, a turtle, a push, a scouting run — and decides between them as the match turns;
# the doctrine that wins that argument supplies the build plan, the production plan and the mode
# assignments, and its modes are what turn into orders. Both halves are client-local, which is
# what lets players write their own without every opponent needing the same code.
# See docs/determinism.md.
#
# Control group membership comes from OpenRA's built-in ControlGroups trait. That trait is
# client-local, which is exactly right here: mode assignment is local policy too.
#
# ModeCommands adds the chatbox interface:
#   /bots                           list installed battle bots
#   /bot <name>                     load one
#   /doctrines                      the doctrines the loaded bot owns
#   /doctrine <name>                run one by hand; the bot may still change its mind
#   /why                            what the bot is running, and what it is looking at
#   /modes                          modes the running doctrine provides
#   /mode <ModeName>                override for the current selection
#   /mode all|type|group ...        override more broadly
#   /assignments                    show what is assigned
#   /whatmode                       report the selection's modes
#   /modelog                        toggle decision logging to debug.log
#   /speed                          report the game speed asked for, and the one being managed
#
# TurboSpeed makes the game speeds AutoC&C adds past the engine's 'fastest' reachable: the engine
# renders one frame per logic tick, so VSync would otherwise cap a 20x match at the refresh rate.
#
# MatchTelemetry records army and economy curves to a CSV for the launcher's match graph. It reads
# every player, which a client can do because it simulates the whole world — so it is written for
# a human to read and is deliberately not reachable from bot or mode code. See docs/determinism.md.
#
# BattleLog is the opposite, and the pair is the point: it records only what the local player's
# code was in a position to react to — enemies coming into view, hits taken, units lost and
# killed, and every doctrine the bot switched to and why — using the same visibility rule
# ctx.SenseThreats filters with. Read the graph to see how a bot did; read the log to see what it
# knew when it decided. ReportsToBattleLog is the player-actor half of it, because the engine
# delivers damage and death notifications to the damaged actor's owner rather than to the world.
#
# Launch.DecisionTrace optionally asks ModeExecutor to write the missing reasoning bridge as JSONL:
# each bot assessment, doctrine outcome, and mode decision that actually became an order. It is
# diagnostic output for after the match and is never exposed back to bot code.
#
# HeadlessSimulation takes over the normal client world loop only when Launch.Headless is present.
# It keeps the order/world/TickRender sequence intact, but removes wall-clock pacing and drawing.

World:
	ModeExecutor:
		GroupCount: 9
	ModeCommands:
	TurboSpeed:
	MatchTelemetry:
	BattleLog:
	HeadlessSimulation:

Player:
	ReportsToBattleLog:
