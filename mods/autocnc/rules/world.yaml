#
# ModeExecutor runs unit modes for the LOCAL player only and turns their decisions into orders.
# Mode code therefore sits outside the lockstep simulation, which is what lets players write
# their own modes without every opponent needing the same code. See docs/determinism.md.
#
# Control group membership comes from OpenRA's built-in ControlGroups trait. That trait is
# client-local, which is exactly right here: mode assignment is local policy too.
#
# ModeCommands adds the chatbox interface:
#   /modules                        list installed doctrines
#   /module <name>                  load one
#   /modes                          modes the loaded module provides
#   /mode <ModeName>                override for the current selection
#   /mode all|type|group ...        override more broadly
#   /assignments                    show what is assigned
#   /whatmode                       report the selection's modes
#   /modelog                        toggle decision logging to debug.log

World:
	ModeExecutor:
		GroupCount: 9
	ModeCommands:
